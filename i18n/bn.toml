# The kit's own strings, and only those, namespaced kit.* — so a consumer's
# key can never collide with one of these, and no merge-precedence rule is
# needed. Precedence rules are always wrong for somebody.
#
# Everything else that used to live here was Schoolyze's vocabulary. It moved
# to schoolyze-server/internal/web/locale/ when this became a platform module:
# a kit that ships one product's words cannot be reused by a second.

